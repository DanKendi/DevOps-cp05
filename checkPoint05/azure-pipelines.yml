# azure-pipelines.yml
# Pipeline CI/CD para o CheckPoint 05 - Spring Boot
# Roda em qualquer agente Ubuntu com Java 17

trigger:
  branches:
    include:
      - main
      - develop

pool:
  vmImage: 'ubuntu-latest'

variables:
  JAVA_VERSION: '17'
  MAVEN_OPTS: '-Xmx1024m'

stages:

  # ─────────────────────────────────────────────
  # 1. BUILD & TEST
  # ─────────────────────────────────────────────
  - stage: Build
    displayName: 'Build e Testes'
    jobs:
      - job: BuildJob
        displayName: 'Maven Build'
        steps:

          - task: JavaToolInstaller@0
            displayName: 'Configurar Java 17'
            inputs:
              versionSpec: '$(JAVA_VERSION)'
              jdkArchitectureOption: 'x64'
              jdkSourceOption: 'PreInstalled'

          - task: Maven@4
            displayName: 'Build + Testes (mvn verify)'
            inputs:
              mavenPomFile: 'pom.xml'
              goals: 'verify'
              options: '--batch-mode --no-transfer-progress'
              publishJUnitResults: true
              testResultsFiles: '**/target/surefire-reports/TEST-*.xml'
              javaHomeOption: 'JDKVersion'
              jdkVersionOption: '1.17'

          - task: PublishTestResults@2
            displayName: 'Publicar resultados dos testes'
            condition: always()
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: '**/target/surefire-reports/TEST-*.xml'

          - task: CopyFiles@2
            displayName: 'Copiar JAR para Staging'
            inputs:
              SourceFolder: '$(System.DefaultWorkingDirectory)/target'
              Contents: '*.jar'
              TargetFolder: '$(Build.ArtifactStagingDirectory)'

          - task: PublishBuildArtifacts@1
            displayName: 'Publicar artefato (JAR)'
            inputs:
              PathtoPublish: '$(Build.ArtifactStagingDirectory)'
              ArtifactName: 'checkpoint05-jar'
              publishLocation: 'Container'

